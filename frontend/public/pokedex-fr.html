<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokédex FR — sprites &amp; noms</title>
<style>
  :root {
    --bg: #1b1f2a;
    --card: #262b3a;
    --card-hover: #2f3548;
    --txt: #f2f2f2;
    --muted: #9aa1b4;
    --accent: #f2b56c;
    --line: #3a4055;
    --green: #78c850;
    --red: #e86a6a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 18px; margin: 0 16px 10px 0; white-space: nowrap; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row + .row { margin-top: 10px; }
  input, select {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--txt);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
  }
  input[type="search"] { flex: 1 1 200px; min-width: 160px; }
  #count { color: var(--muted); font-size: 13px; margin-left: auto; white-space: nowrap; }
  .tab {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--txt);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .tab:hover { background: var(--card-hover); }
  .tab.active { background: var(--accent); color: #1b1f2a; border-color: var(--accent); }
  #trainerPanel {
    display: none;
    margin-top: 10px;
    padding: 10px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 13px;
    gap: 4px 20px;
    flex-wrap: wrap;
  }
  #trainerPanel .blurb { flex-basis: 100%; color: var(--muted); }
  #trainerPanel b { color: var(--accent); }
  .stat-ok { color: var(--green); }
  .stat-no { color: var(--red); }

  /* --- comparaison hebdo --- */
  #compare {
    padding: 18px 20px 6px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 14px;
  }
  .trainer-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
  }
  .trainer-card .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 2px; }
  .trainer-card .head .n { font-weight: 800; font-size: 15px; }
  .trainer-card .blurb2 { color: var(--muted); font-size: 12px; margin: 0 0 10px; min-height: 32px; }
  .trainer-card .badges2 { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .pill { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: #1b1f2a; border: 1px solid var(--line); }
  .pill.ok { color: var(--green); border-color: var(--green); }
  .pill.no { color: var(--muted); }
  .pill.fire { color: var(--accent); border-color: var(--accent); }
  .chart { position: relative; height: 110px; margin: 0 0 6px; }
  .chart .grid-line { position: absolute; inset-inline: 0; border-top: 1px dashed var(--line); }
  .chart .goal-line { position: absolute; inset-inline: 0; border-top: 2px dashed var(--accent); z-index: 2; }
  .chart .goal-line span {
    position: absolute; right: 0; top: -15px; font-size: 9px; font-weight: 700;
    color: var(--accent); background: var(--card); padding: 0 3px;
  }
  .chart .bars { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 5px; }
  .chart .bar-col { flex: 1; position: relative; height: 100%; }
  .chart .bar-track { position: absolute; inset: 0; border-radius: 4px 4px 0 0; background: rgba(255,255,255,0.05); }
  .chart .bar-track.rest { background: rgba(255,255,255,0.02); }
  .chart .bar-fill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 4px 4px 0 0; background: var(--accent); min-height: 0; }
  .chart .bar-fill.rest { background: #6890c8; }
  .chart .bar-val {
    position: absolute; left: 0; right: 0; text-align: center; font-size: 9px; font-weight: 700;
    color: var(--txt); transform: translateY(-14px);
  }
  .day-labels { display: flex; gap: 5px; }
  .day-labels span { flex: 1; text-align: center; font-size: 10px; color: var(--muted); font-weight: 700; }

  main {
    padding: 16px 20px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
    gap: 10px;
  }
  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 4px;
    transition: background 0.12s;
  }
  .card:hover { background: var(--card-hover); }
  .card img {
    width: 72px;
    height: 72px;
    object-fit: contain;
    image-rendering: pixelated;
  }
  .name { font-weight: 700; font-size: 13px; }
  .num { color: var(--muted); font-size: 11px; }
  .badges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
  .badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 999px;
    color: #1b1f2a;
  }
  .rare-tag { font-size: 10px; color: var(--muted); }
  .legendary { outline: 2px solid #f2d56c; }
  .mythical { outline: 2px solid #e86a6a; }
  .capture-tag {
    position: absolute;
    top: 6px;
    right: 6px;
    background: var(--accent);
    color: #1b1f2a;
    font-size: 10px;
    font-weight: 800;
    border-radius: 999px;
    padding: 2px 7px;
  }
  #empty { display: none; text-align: center; color: var(--muted); padding: 40px 0; }
  .rarity-edit {
    display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted);
  }
  .rarity-edit input {
    width: 48px; padding: 2px 4px; font-size: 11px; text-align: center;
  }
  .edited { outline: 2px solid #78c850 !important; }
  .edited-tag {
    position: absolute; top: 6px; left: 6px; background: var(--green); color: #1b1f2a;
    font-size: 10px; font-weight: 800; border-radius: 999px; padding: 2px 6px;
  }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>🔎 Pokédex FR</h1>
    <input type="search" id="q" placeholder="Nom français (ex : Carapuce, Roucool…)">
    <select id="region"><option value="">Toutes régions</option></select>
    <select id="type"><option value="">Tous types</option></select>
    <select id="rarity">
      <option value="">Toute rareté</option>
      <option value="legendary">Légendaires</option>
      <option value="mythical">Fabuleux</option>
    </select>
    <select id="sort">
      <option value="num">Trier : n° Pokédex</option>
      <option value="rarity-asc">Trier : rareté ↑ (commun → rare)</option>
      <option value="rarity-desc">Trier : rareté ↓ (rare → commun)</option>
      <option value="name">Trier : nom A → Z</option>
    </select>
    <span id="count"></span>
  </div>
  <div class="row" id="trainerTabs"></div>
  <div class="row" id="trainerPanel"></div>
  <div class="row">
    <button class="tab" id="editToggle">✏️ Mode édition (rareté)</button>
    <span id="changesCount" style="color:var(--muted);font-size:12px"></span>
    <button class="tab" id="copyChanges" style="display:none">📋 Copier les modifications</button>
    <button class="tab" id="resetChanges" style="display:none">↺ Réinitialiser</button>
  </div>
  <textarea id="changesOut" readonly
    style="display:none;width:100%;margin-top:8px;height:120px;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:monospace;font-size:12px"></textarea>
</header>
<section id="compare">
  <h2 style="grid-column:1/-1">📊 Semaine type de chacun (lignes pointillées orange = objectif/jour) — clique une carte pour filtrer le Pokédex en dessous</h2>
</section>
<main id="grid"></main>
<p id="empty">Aucun Pokémon ne correspond.</p>

const TYPE_COLORS = {
  "Normal": "#A8A878", "Feu": "#F08030", "Eau": "#6890F0", "Électrik": "#F8D030",
  "Plante": "#78C850", "Glace": "#98D8D8", "Combat": "#C03028", "Poison": "#A040A0",
  "Sol": "#E0C068", "Vol": "#A890F0", "Psy": "#F85888", "Insecte": "#A8B820",
  "Roche": "#B8A038", "Spectre": "#705898", "Dragon": "#7038F8", "Ténèbres": "#705848",
  "Acier": "#B8B8D0", "Fée": "#EE99AC",
};
const DAY_LABELS = ["L", "M", "M", "J", "V", "S", "D"];

const grid = document.getElementById("grid");
const empty = document.getElementById("empty");
const count = document.getElementById("count");
const qInput = document.getElementById("q");
const regionSelect = document.getElementById("region");
const typeSelect = document.getElementById("type");
const raritySelect = document.getElementById("rarity");
const sortSelect = document.getElementById("sort");
const trainerTabs = document.getElementById("trainerTabs");
const trainerPanel = document.getElementById("trainerPanel");
const compare = document.getElementById("compare");
const editToggle = document.getElementById("editToggle");
const changesCountEl = document.getElementById("changesCount");
const copyChangesBtn = document.getElementById("copyChanges");
const resetChangesBtn = document.getElementById("resetChanges");
const changesOut = document.getElementById("changesOut");

// --- mode édition de la rareté : persisté en local, à copier-coller pour appliquer côté DB ---
let editMode = false;
function loadChanges() {
  try { return JSON.parse(localStorage.getItem("pokedexRarityChanges") || "{}"); }
  catch { return {}; }
}
let rarityChanges = loadChanges(); // { [pokemonId]: nouvelleRareté }
function saveChanges() {
  try { localStorage.setItem("pokedexRarityChanges", JSON.stringify(rarityChanges)); } catch {}
}

function updateChangesUI() {
  const n = Object.keys(rarityChanges).length;
  changesCountEl.textContent = n ? `${n} modification${n > 1 ? "s" : ""} en attente` : "";
  copyChangesBtn.style.display = n ? "" : "none";
  resetChangesBtn.style.display = n ? "" : "none";
}

editToggle.addEventListener("click", () => {
  editMode = !editMode;
  editToggle.classList.toggle("active", editMode);
  editToggle.textContent = editMode ? "✅ Édition activée (clique pour sortir)" : "✏️ Mode édition (rareté)";
  render();
});

copyChangesBtn.addEventListener("click", () => {
  const arr = Object.entries(rarityChanges).map(([id, newRarity]) => {
    const p = POKEMON.find((x) => x.id === Number(id));
    return { id: Number(id), name: p ? p.name : null, slug: p ? p.slug : null, oldRarity: p ? p.rarity : null, newRarity };
  });
  const text = JSON.stringify(arr, null, 2);
  changesOut.value = text;
  changesOut.style.display = "block";
  changesOut.focus();
  changesOut.select();
  const done = () => {
    copyChangesBtn.textContent = "✅ Copié — colle-le dans le chat";
    setTimeout(() => (copyChangesBtn.textContent = "📋 Copier les modifications"), 2000);
  };
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => {
      copyChangesBtn.textContent = "⚠️ Copie auto impossible : Ctrl+C dans le champ ci-dessous";
    });
  } else {
    copyChangesBtn.textContent = "⚠️ Copie auto impossible : Ctrl+C dans le champ ci-dessous";
  }
});

resetChangesBtn.addEventListener("click", () => {
  if (!confirm("Annuler toutes les modifications de rareté en attente ?")) return;
  rarityChanges = {};
  saveChanges();
  updateChangesUI();
  changesOut.style.display = "none";
  render();
});

function onRarityChange(e) {
  const id = Number(e.target.dataset.id);
  const original = POKEMON.find((x) => x.id === id);
  let v = Math.round(Number(e.target.value));
  if (Number.isNaN(v)) v = original ? (original.rarity ?? 50) : 50;
  v = Math.max(0, Math.min(100, v));
  e.target.value = v;
  if (original && original.rarity === v) delete rarityChanges[id];
  else rarityChanges[id] = v;
  saveChanges();
  updateChangesUI();
  render();
}

// remplit les <select> à partir du pokédex complet
const regions = [...new Set(POKEMON.map((p) => p.region))];
for (const r of regions) regionSelect.add(new Option(r, r));
const types = [...new Set(POKEMON.flatMap((p) => p.types))].sort();
for (const t of types) typeSelect.add(new Option(t, t));

// --- graphique "semaine type" de comparaison, toujours visible ---
function weekChart(t) {
  const max = Math.max(t.dailyGoalMinutes, ...t.week.map((d) => d.minutes)) * 1.15;
  const pct = (m) => (max ? (m / max) * 100 : 0);
  const goalPct = pct(t.dailyGoalMinutes);
  const bars = t.week
    .map((d) => {
      const h = Math.max(pct(d.minutes), d.minutes > 0 ? 3 : 0);
      return `
        <div class="bar-col">
          <div class="bar-track${d.isWorkDay ? "" : " rest"}"></div>
          ${d.minutes > 0 ? `<span class="bar-val" style="bottom:${h}%">${d.minutes}m</span>` : ""}
          <div class="bar-fill${d.isWorkDay ? "" : " rest"}" style="height:${h}%"></div>
        </div>`;
    })
    .join("");
  return `
    <div class="chart">
      <div class="goal-line" style="bottom:${goalPct}%"><span>${t.dailyGoalMinutes}m</span></div>
      <div class="bars">${bars}</div>
    </div>
    <div class="day-labels">${DAY_LABELS.map((l) => `<span>${l}</span>`).join("")}</div>
  `;
}

function renderCompare() {
  compare.querySelectorAll(".trainer-card").forEach((el) => el.remove());
  for (const t of TRAINERS) {
    const el = document.createElement("div");
    el.className = "trainer-card" + (currentTrainer === t.key ? " active" : "");
    el.style.cursor = "pointer";
    el.style.outline = currentTrainer === t.key ? "2px solid var(--accent)" : "none";
    el.innerHTML = `
      <div class="head"><span class="n">🎒 ${t.name}</span></div>
      <p class="blurb2">${t.blurb}</p>
      <div class="badges2">
        <span class="pill fire">🔥 ${t.streakDays} j de série</span>
        <span class="pill ${t.weeklyGoalMet ? "ok" : "no"}">${t.weeklyGoalMet ? "✅ objectif atteint" : "❌ objectif non atteint"}</span>
      </div>
      ${weekChart(t)}
      <p class="blurb2" style="margin:8px 0 0">${t.totalCaptures} captures · ${t.species} espèces sur ${t.sessions} sessions (8 sem.)</p>
    `;
    el.addEventListener("click", () => {
      currentTrainer = currentTrainer === t.key ? null : t.key;
      renderTabs();
      renderCompare();
      render();
    });
    compare.appendChild(el);
  }
}

// --- onglets dresseurs (filtrent la grille du pokédex en dessous) ---
let currentTrainer = null; // null = pokédex complet

function makeTab(key, label) {
  const b = document.createElement("button");
  b.className = "tab" + (currentTrainer === key ? " active" : "");
  b.textContent = label;
  b.addEventListener("click", () => {
    currentTrainer = currentTrainer === key ? null : key;
    renderTabs();
    renderCompare();
    render();
  });
  return b;
}

function renderTabs() {
  trainerTabs.innerHTML = "";
  trainerTabs.appendChild(makeTab(null, "📖 Pokédex complet"));
  for (const t of TRAINERS) {
    trainerTabs.appendChild(makeTab(t.key, `🎒 ${t.name}`));
  }
  const t = TRAINERS.find((t) => t.key === currentTrainer);
  if (!t) {
    trainerPanel.style.display = "none";
  } else {
    trainerPanel.style.display = "flex";
    trainerPanel.innerHTML = `
      <div class="blurb">${t.blurb}</div>
      <div>🔥 Série : <b>${t.streakDays} j</b></div>
      <div>🎯 Objectif hebdo : <b class="${t.weeklyGoalMet ? "stat-ok" : "stat-no"}">${t.weeklyGoalMet ? "atteint" : "non atteint"}</b></div>
      <div>⏱️ ${t.sessions} sessions · ${Math.round(t.totalMinutes / 60)} h</div>
      <div>✨ ${t.totalCaptures} captures · ${t.species} espèces</div>
    `;
  }
}

// rareté effective : modification locale en attente, sinon repli comme côté serveur
function effRarity(p) {
  const override = rarityChanges[p.id];
  if (override != null) return override;
  if (p.rarity != null) return p.rarity;
  return p.mythical ? 100 : p.legendary ? 99 : 50;
}

function card(p, capture) {
  const el = document.createElement("div");
  const r = effRarity(p);
  const isEdited = rarityChanges[p.id] != null;
  const rareKind = p.mythical ? "✦ Fabuleux · " : p.legendary ? "★ Légendaire · " : "";
  el.className =
    "card" + (p.legendary ? " legendary" : "") + (p.mythical ? " mythical" : "") + (isEdited ? " edited" : "");
  el.innerHTML = `
    ${capture ? `<span class="capture-tag">×${capture.count} · Niv.${capture.level}</span>` : ""}
    ${isEdited ? `<span class="edited-tag">modifié</span>` : ""}
    <img src="pokemon/${p.slug}.png" alt="${p.name}" loading="lazy"
         onerror="this.style.opacity=0.15">
    <div class="name">${p.name}</div>
    <div class="num">#${String(p.id).padStart(3, "0")} · ${p.region}</div>
    <div class="badges">
      ${p.types.map((t) => `<span class="badge" style="background:${TYPE_COLORS[t] || "#888"}">${t}</span>`).join("")}
    </div>
    ${
      editMode
        ? `<div class="rarity-edit">${rareKind}<span>Rareté</span><input type="number" min="0" max="100" step="1" value="${r}" data-id="${p.id}" class="rarity-input"></div>`
        : `<div class="rare-tag">${rareKind}Rareté ${r}</div>`
    }
  `;
  if (editMode) {
    const input = el.querySelector(".rarity-input");
    input.addEventListener("click", (e) => e.stopPropagation());
    input.addEventListener("change", onRarityChange);
  }
  return el;
}

const SORTERS = {
  num: (a, b) => a.id - b.id,
  "rarity-asc": (a, b) => effRarity(a) - effRarity(b) || a.id - b.id,
  "rarity-desc": (a, b) => effRarity(b) - effRarity(a) || a.id - b.id,
  name: (a, b) => a.name.localeCompare(b.name, "fr"),
};

function render() {
  const q = qInput.value.trim().toLowerCase();
  const region = regionSelect.value;
  const type = typeSelect.value;
  const rarity = raritySelect.value;
  const sort = sortSelect.value;
  const trainer = TRAINERS.find((t) => t.key === currentTrainer);
  const base = trainer ? trainer.pokemon : POKEMON;

  const filtered = base
    .filter((p) => {
      if (q && !p.name.toLowerCase().includes(q) && !p.slug.includes(q)) return false;
      if (region && p.region !== region) return false;
      if (type && !p.types.includes(type)) return false;
      if (rarity === "legendary" && !p.legendary) return false;
      if (rarity === "mythical" && !p.mythical) return false;
      return true;
    })
    .sort(SORTERS[sort] || SORTERS.num);

  grid.innerHTML = "";
  const frag = document.createDocumentFragment();
  for (const p of filtered) frag.appendChild(card(p, trainer ? p : null));
  grid.appendChild(frag);
  count.textContent = trainer
    ? `${filtered.length} / ${trainer.pokemon.length} (collection de ${trainer.name})`
    : `${filtered.length} / ${POKEMON.length}`;
  empty.style.display = filtered.length ? "none" : "block";
}

for (const el of [qInput, regionSelect, typeSelect, raritySelect, sortSelect]) el.addEventListener("input", render);
updateChangesUI();
renderCompare();
renderTabs();
render();
</script>
</body>
</html>
